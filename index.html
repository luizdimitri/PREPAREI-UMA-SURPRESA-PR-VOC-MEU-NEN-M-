<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossa Jornada de Amor</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            font-family: 'Courier New', Courier, monospace; 
            color: white; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 35, 0.98); z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        #start-btn {
            margin-top: 25px; padding: 18px 35px; background: #ff4757; color: white;
            border: none; font-size: 20px; font-weight: bold; border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
            animation: pulse 1.2s infinite; cursor: pointer;
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; left: 0; 
            overflow: hidden; 
        }
        #player { 
            width: 45px; height: 45px; 
            background: #ff4757; 
            position: absolute; 
            bottom: 120px; left: 40px; 
            border-radius: 50%; 
            box-shadow: 0 0 15px #ff4757;
            z-index: 5;
            transition: transform 0.1s;
        }
        .memory { 
            width: 55px; height: 55px; 
            background: gold; 
            position: absolute; 
            border-radius: 50%; 
            border: 4px solid white; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 26px; 
            box-shadow: 0 0 15px gold;
            animation: pulse 1.2s infinite; 
            z-index: 4;
        }
        .level-door { 
            width: 65px; height: 110px; 
            background: #8b4513; 
            position: absolute; bottom: 120px; right: 30px;
            border: 4px solid #deb887;
            border-radius: 8px 8px 0 0;
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 14px; color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 3;
        }
        .ground {
            position: absolute; bottom: 0; width: 100%; height: 120px;
            background: #2f3640;
            border-top: 6px solid #48dbfb;
            z-index: 2;
        }
        
        /* Controles para celular Otimizados */
        #controls { 
            position: fixed; bottom: 15px; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 0 20px;
            z-index: 20; 
        }
        .control-btn { 
            width: 75px; height: 75px; 
            background: rgba(255, 255, 255, 0.25); 
            border: 3px solid white; 
            border-radius: 50%; 
            color: white; font-size: 32px; 
            display: flex; align-items: center; justify-content: center; 
            user-select: none; -webkit-user-select: none; 
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }

        /* Modal para exibir as fotos e declarações */
        #memory-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.92); z-index: 100; 
            flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box;
        }
        #modal-content { 
            max-width: 100%; width: 340px; text-align: center; 
            background: #111; padding: 15px; border-radius: 12px;
            border: 2px solid #ff4757;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.4);
            max-height: 90vh; overflow-y: auto;
        }
        #memory-image { 
            width: 100%; max-height: 45vh; object-fit: cover; 
            border: 3px solid white; border-radius: 8px; 
        }
        #memory-text { 
            margin-top: 15px; font-size: 15px; line-height: 1.5; 
            padding: 0 5px; color: #f1f2f6; text-align: left;
        }
        #close-modal { 
            margin-top: 15px; width: 100%; padding: 12px; 
            background: #ff4757; color: white; border: none; 
            font-size: 16px; font-weight: bold; border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }

        #top-info {
            position: fixed; top: 15px; width: 100%; text-align: center;
            font-size: 16px; font-weight: bold; color: #ff4757; z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<!-- Tela de Início para Liberar o Áudio no Celular -->
<div id="start-overlay">
    <h1 style="color: #ff4757; font-size: 26px;">Nossa História de Amor ❤️</h1>
    <p style="font-size: 16px; color: #dcdde1; line-height: 1.5; max-width: 280px;">
        Preparei uma surpresa especial para você... Aumente o som do seu celular!
    </p>
    <button id="start-btn">Começar a Jogar ✨</button>
</div>

<div id="top-info">Fase <span id="level-indicator">1</span> de 6 - Toque no ❤️ para ver a memória</div>

<div id="game-container">
    <div class="ground"></div>
    <div id="player"></div>
</div>

<div id="memory-modal">
    <div id="modal-content">
        <img id="memory-image" src="" alt="Nossa Memória">
        <div id="memory-text"></div>
        <button id="close-modal">Continuar Jornada ❤️</button>
    </div>
</div>

<!-- Controles Móveis -->
<div id="controls">
    <div class="control-btn" id="btn-left">◀</div>
    <div class="control-btn" id="btn-up">▲</div>
    <div class="control-btn" id="btn-right">▶</div>
</div>

<!-- Áudio da Poesia Acústica -->
<audio id="bg-music" loop preload="auto">
    <source src="poesia11_trecho.mp3" type="audio/mpeg">
</audio>

<script>
    const player = document.getElementById('player');
    const bgMusic = document.getElementById('bg-music');
    let playerX = 40;
    let playerY = 0;
    const moveSpeed = 15;
    let isJumping = false;
    let currentLevel = 1;

    // Fases configuradas com as suas 6 fotos reais e legendas românticas
    const levels = {
        1: { 
            memory: { x: 260, y: 150, image: "foto1.jpg", text: "❤️ **Fase 1:** O começo do nosso universo. A primeira vez que o meu mundo parou de verdade só de olhar pro seu sorriso. Ali eu já soube que você seria muito especial na minha vida." } 
        },
        2: { 
            memory: { x: 280, y: 180, image: "foto2.jpg", text: "✨ **Fase 2:** Cada instante ao seu lado me traz uma paz que eu nunca tinha sentido antes. Olhar pra você é ter a certeza absoluta de que encontrei o meu lugar no mundo." } 
        },
        3: { 
            memory: { x: 250, y: 160, image: "foto3.jpg", text: "🥰 **Fase 3:** Nosso cantinho, nossos passeios simples... você tem o dom de transformar qualquer dia comum no momento mais perfeito de todos. Você ilumina tudo ao meu redor." } 
        },
        4: { 
            memory: { x: 290, y: 170, image: "foto4.jpg", text: "🤪 **Fase 4:** Com você eu sou livre, sou eu mesmo, dou as melhores risadas e me sinto o cara mais sortudo desse mundo. Nossa sintonia é única!" } 
        },
        5: { 
            memory: { x: 260, y: 160, image: "foto5.jpg", text: "🔥 **Fase 5:** Meu respeito, meu carinho e meu amor por você só aumentam a cada dia que passa. Você é a minha melhor companhia, minha grande parceira de vida." } 
        },
        6: { // DECLARAÇÃO FINAL EMOCIONANTE E CARINHOSA
            memory: { x: 270, y: 170, image: "foto6.jpg", text: "💖 **DECLARAÇÃO FINAL:**<br><br>Minha pequenina... Você é, sem sombra de dúvidas, a pessoa mais linda e importante que já entrou na minha vida.<br><br>Eu não consigo mais imaginar os meus dias sem o seu abraço, sem a sua voz carinhosa, sem a sua presença quentinha e sem o seu amor. Você me transformou por inteiro, me ensinou a amar de verdade e trouxe uma felicidade que eu nem sabia que existia.<br><br>Sou completamente, infinitamente apaixonado por você. Tenho por você um respeito enorme, um carinho profundo e uma paixão que só cresce. Obrigado por ser minha companheira, por cuidar de mim e por ser o meu porto seguro.<br><br>Eu te amo com todo o meu coração, hoje e para todo o sempre! ✨❤️" } 
        }
    };

    // Liberar áudio com botão inicial
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-overlay').style.display = 'none';
        playMusic();
    };

    function playMusic() {
        if (bgMusic) {
            bgMusic.play().then(() => {
                console.log("Música tocando com sucesso!");
            }).catch(e => {
                console.log("Aguardando mais interação do usuário...", e);
            });
        }
    }

    function loadLevel(levelNum) {
        currentLevel = levelNum;
        document.getElementById('level-indicator').innerText = levelNum;
        
        document.querySelectorAll('.memory, .level-door').forEach(el => el.remove());

        const container = document.getElementById('game-container');
        const levelData = levels[levelNum];

        const memEl = document.createElement('div');
        memEl.className = 'memory';
        memEl.style.left = `${levelData.memory.x}px`;
        memEl.style.bottom = `${levelData.memory.y + 120}px`;
        memEl.innerHTML = "❤️";
        memEl.onclick = () => showMemory(levelData.memory.image, levelData.memory.text);
        container.appendChild(memEl);

        if (levelNum < 6) {
            const door = document.createElement('div');
            door.className = 'level-door';
